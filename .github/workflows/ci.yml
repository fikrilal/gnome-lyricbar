name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Audit dependencies
        run: npm audit

      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: lyricbar-extension
          path: dist/*.zip
          if-no-files-found: error

  commitlint:
    name: Commit Messages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Validate push commits
        if: github.event_name == 'push'
        run: npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
