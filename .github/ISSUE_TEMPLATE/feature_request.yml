name: Feature request
description: Suggest a LyricBar feature or product improvement.
title: 'Feature: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this for product improvements, preferences, installer behavior, diagnostics, and UI changes.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
      placeholder: I want to hide the settings icon because...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should LyricBar do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Preference exists for ...
        - Existing behavior remains unchanged by default.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Screenshots, examples, related issues, or user feedback.
    validations:
      required: false
